name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # Branch protection on main requires this job. Automatic fix runs merge
  # their own PRs, so this check is the gate for every merge.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go build ./...
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test -count=1 ./...
  # Automatic fix runs push autofix/* branches. They must not change the
  # workflows, because the workflows are the merge gate.
  guard:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'autofix/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          if git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" | grep '^\.github/'; then
            echo "autofix branches must not change .github/" >&2
            exit 1
          fi
